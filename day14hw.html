<!-- type განსაზღვრავს input-ის ტიპს, name გამოიყენება მონაცემების გაგზავნისას, id უნიკალური იდენტიფიკატორია, label-თან დასაკავშირებლად, value არის input-ში არსებული მნიშვნელობა -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
  <label for="fname">name:</label>
  <input type="text" id="fname" name="firstName"><br><br>

  <label for="lname">suriname:</label>
  <input type="text" id="lname" name="lastName"><br><br>

  <label for="email">email:</label>
  <input type="email" id="email" name="email"><br><br>

  <label for="amount">cash amount:</label>
  <input type="number" id="amount" name="amount"><br><br>

  <p>სქესი:</p>
  <label>
    <input type="radio" name="gender" value="male"> male
  </label>
  <label>
    <input type="radio" name="gender" value="female"> female
  </label><br><br>

  <label for="currency">currency:</label>
  <select id="currency" name="currency">
    <option value="" disabled selected>Select currency</option>
    <option value="gel">gel</option>
    <option value="usd">dollar</option>
    <option value="eur">euro</option>
  </select><br><br>

  <button type="submit">register</button>
</form>

<form>
  <label>რომელია საქართველოს დედაქალაქი?</label><br><br>

  <label>
    <input type="radio" name="answer" value="ჭიათურა"> ჭიათურა
  </label><br>

  <label>
    <input type="radio" name="answer" value="საჩხერე"> საჩხერე
  </label><br>

  <label>
    <input type="radio" name="answer" value="ქუთაისი"> ქუთაისი
  </label><br>

  <label>
    <input type="radio" name="answer" value="თბილისი"> თბილისი
  </label><br><br>

  <button type="submit">დადასტურება</button>
</form>

<form>
  <label for="name">name:</label>
  <input type="text" id="name" name="name" required><br><br>

  <label for="surname">surname:</label>
  <input type="text" id="surname" name="surname" required><br><br>

  <label for="password">password:</label>
  <input type="password" id="password" name="password" required><br><br>

  <label for="mail">email:</label>
  <input type="email" id="mail" name="mail" required><br><br>

  <button type="submit">send</button>
</form>

</body>
</html>
